# Output-generator region (microns) — THIS is the real OG boundary.
# Instances inside this band are excluded from puzzle_core_* netlists.
#
# Note: the hatched "output generator" box on layout.png is only a label/
# annotation region, NOT the true OG extent. Use this band instead.
#
# Strict/open bounds: x > EXCLUDE_XMIN, EXCLUDE_YMIN < y < EXCLUDE_YMAX
# (keeps top/bottom strips at high x outside YMIN..YMAX)
EXCLUDE_XMIN=148
EXCLUDE_YMIN=80
EXCLUDE_XMAX=210
EXCLUDE_YMAX=262
